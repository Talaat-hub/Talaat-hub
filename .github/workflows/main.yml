name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Talaat-hub
          outputs: |
            dist/github-contribution-grid-snake.svg
          color_snake: "#58A6FF"            # Choose a snake color
          color_dots: "#8B949E"            # Choose a dots/grid color
          color_background: "transparent"  # Make the background transparent
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAGES_PAT }}